<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nick Feed</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preload" href="fonts/PlusJakartaSans-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=18">
</head>
<body>
  <div id="splash">
    <span id="splash-text">NICK FEED</span>
  </div>
  <div id="app">
    <div id="settings-overlay" style="display:none">
      <div id="settings-panel">
        <h2>Settings</h2>
        <button id="btn-sync-feedback">Sync Feedback to GitHub</button>
        <div id="sync-status"></div>
        <button id="btn-view-feedback">View Feedback Summary</button>
        <button id="btn-export">Copy Feedback Summary</button>
        <button id="btn-export-index">Copy Card Index (for generation)</button>
        <button id="btn-restart" style="background:#3a1a1a;border-color:#5a2a2a;">Restart Feed</button>
        <hr style="border:none;border-top:1px solid #2a2a2a;margin:0.5rem 0">
        <div id="token-section">
          <label style="font-size:0.75rem;color:var(--text-muted);display:block;margin-bottom:0.5rem;text-align:left;">GitHub Token (stored locally)</label>
          <input type="password" id="github-token-input" placeholder="ghp_..." style="width:100%;padding:0.5rem;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:6px;color:var(--text);font-family:inherit;font-size:0.85rem;margin-bottom:0.5rem;">
          <button id="btn-save-token">Save Token</button>
        </div>
        <button id="btn-close-settings">Close</button>
      </div>
    </div>
    <div id="feedback-view-overlay" style="display:none">
      <div id="feedback-view-panel">
        <pre id="feedback-view-content"></pre>
        <button id="btn-close-feedback-view">Close</button>
      </div>
    </div>
    <header id="header">
      <span id="app-name">NICK FEED</span>
      <span id="card-counter"></span>
      <span id="streak"></span>
      <button id="btn-settings" aria-label="Settings">⚙</button>
    </header>
    <main id="card-area">
      <div id="card-container"></div>
    </main>
    <footer id="footer">
      <button id="btn-back" aria-label="Previous card">←</button>
      <div id="feedback-buttons">
        <button id="btn-dislike" aria-label="Dislike">👎</button>
        <button id="btn-like" aria-label="Like">👍</button>
      </div>
      <button id="btn-comment" aria-label="Comment">💬</button>
      <button id="btn-next" aria-label="Next card">→</button>
    </footer>
    <div id="comment-overlay" style="display:none">
      <div id="comment-panel">
        <h2>Add a thought</h2>
        <textarea id="comment-input" placeholder="What came to mind?" rows="4"></textarea>
        <div id="comment-actions">
          <button id="comment-cancel">Cancel</button>
          <button id="comment-save">Save</button>
        </div>
      </div>
    </div>
  </div>
  <script src="svg-gen.js?v=18"></script>
  <script src="app.js?v=18"></script>
</body>
</html>
